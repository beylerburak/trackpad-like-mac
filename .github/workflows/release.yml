name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches VERSION
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"

      - name: Test
        run: make test

      - name: Build package and source tarball
        run: |
          make deb dist
          cd dist && sha256sum -- * > SHA256SUMS

      - name: Extract release notes
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            /^## / { if (found) exit; found = index($0, "[" v "]") > 0; next }
            found' CHANGELOG.md > notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
