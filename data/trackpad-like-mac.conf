# trackpad-like-mac: three-finger drag settings. Apply changes with:
#   sudo systemctl restart trackpad-like-mac

[drag]
# Drag pointer speed multiplier (1.0 = normal).
speed = 1.0

# How long the drag waits after you lift your fingers, so you can re-place
# them and keep dragging (milliseconds).
release_delay_ms = 250

# How far three fingers must move before the drag starts (millimetres).
start_threshold_mm = 1.0
